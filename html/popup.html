<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meet Participant Counter</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container">

    <div class="top-bar">
        <h1>Better go smoke a joint</h1>

        <div class="right-panel">
            <button class="action-btn" id="leaveBtn">Leave</button>
            <div class="counter">
                <span id="count">0</span>
            </div>
        </div>
    </div>

    <div class="slider-block">
        <label for="participantsThreshold">
            Pick how many people before you bounce:
            <span id="participantsValue">3</span>
        </label>

        <input
            type="range"
            id="participantsThreshold"
            min="1"
            max="40"
            value="3"
        >
    </div>

    <div class="toggle-row">
        <span class="toggle-label">Auto leave</span>
        <div class="toggle">
            <input type="checkbox" id="toggle-switch">
            <label for="toggle-switch"></label>
        </div>
    </div>

</div>

<script type="module" src="../js/popup.js" defer></script>
</body>
</html>
